# ==============================================================================
# Logging Configuration
# ==============================================================================

logging:
  level: info  # Use 'info' for production, 'debug' for troubleshooting
  format: json # JSON format for structured logging

# ==============================================================================
# Telemetry Configuration
# ==============================================================================

telemetry:
  metrics: true
  tracing: false  # Enable for detailed troubleshooting only

# ==============================================================================
# Security Notes
# ==============================================================================
#
# PCI DSS Compliance:
# 1. Always use TLS in production (use_tls: "true")
# 2. Verify TLS certificates (tls_skip_verify: "false")
# 3. Never log full card numbers (automatically masked)
# 4. Never log PIN data (filtered by driver)
# 5. Store this config file securely with restricted permissions
# 6. Rotate terminal credentials regularly
# 7. Use separate terminals for different networks (Mada, KNET)
# 8. Enable audit logging for all transactions
# 9. Monitor failed transaction attempts
# 10. Keep Device Bridge software updated
#
# Terminal Security:
# - Restrict network access to payment terminals
# - Use firewalls to block unauthorized access
# - Isolate payment network from other networks
# - Enable TLS certificate pinning if possible
# - Monitor terminal connectivity status
# - Alert on unexpected disconnections
#
# Data Protection:
# - All sensitive data is masked in logs
# - Card data is never stored by Device Bridge
# - Transaction data is ephemeral (not persisted)
# - Use memory-safe languages (Go) to prevent data leaks

# ==============================================================================
# Troubleshooting
# ==============================================================================
#
# Connection Issues:
# - Verify terminal IP address and port
# - Check network connectivity (ping terminal)
# - Verify firewall rules allow traffic
# - Check TLS certificate validity
# - Review terminal logs for errors
#
# Transaction Failures:
# - Check terminal status (connected/disconnected)
# - Verify terminal_id and merchant_id are correct
# - Check transaction amount format (cents/fils)
# - Verify currency code (SAR, KWD, etc.)
# - Review response codes for decline reason
#
# Timeout Issues:
# - Increase read_timeout for slow transactions
# - Check network latency
# - Verify terminal is responsive
# - Check for terminal software updates
#
# Testing:
# - Use simulator provider for development
# - Test with small amounts first
# - Verify receipt printing integration
# - Test void/refund operations
# - Test connection retry logic
# - Perform end-to-end testing before production

# ==============================================================================
# Currency Codes (ISO 4217)
# ==============================================================================
#
# Common GCC currencies:
# - 682: SAR (Saudi Riyal) - 2 decimal places
# - 414: KWD (Kuwaiti Dinar) - 3 decimal places
# - 048: BHD (Bahraini Dinar) - 3 decimal places
# - 784: AED (UAE Dirham) - 2 decimal places
# - 512: OMR (Omani Rial) - 3 decimal places
# - 634: QAR (Qatari Riyal) - 2 decimal places
#
# Note: When setting amounts, use the smallest currency unit:
# - SAR 10.50 = 1050 (fils)
# - KWD 10.500 = 10500 (fils)

# ==============================================================================
# Response Codes Reference
# ==============================================================================
#
# Common response codes:
# - 00: Approved
# - 05: Do not honor (generic decline)
# - 51: Insufficient funds
# - 54: Expired card
# - 55: Incorrect PIN
# - 57: Transaction not permitted to cardholder
# - 58: Transaction not permitted to terminal
# - 91: Issuer unavailable
#
# Full list available in ISO 8583 specification
