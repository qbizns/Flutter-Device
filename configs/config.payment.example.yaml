# Payment Terminal Configuration Examples
# ==========================================
#
# This file demonstrates various payment terminal configurations for
# different payment providers and deployment scenarios.

# Server Configuration
server:
  grpc:
    address: ":50051"
  rest:
    address: ":8080"
  websocket:
    path: "/ws"

security:
  mode: "production"  # Important: Use production mode for payment processing

# ==============================================================================
# Example 1: Mada Payment Terminal (Saudi Arabia)
# ==============================================================================
# Configuration for Saudi domestic card payments using Mada network

devices:
  - id: mada-terminal-01
    name: "Mada Payment Terminal"
    kind: payment.tcp
    enabled: true
    metadata:
      # Terminal connection
      host: "192.168.1.100"          # Terminal IP address
      port: "3000"                    # Terminal port
      use_tls: "true"                 # Use TLS for secure communication
      tls_skip_verify: "false"        # Verify TLS certificates in production

      # Terminal identification
      terminal_id: "12345678"         # 8-digit terminal ID
      merchant_id: "123456789012345"  # 15-digit merchant ID

      # Provider settings
      provider: "mada"                # Payment provider: mada, knet, simulator
      message_format: "1987"          # ISO 8583 format version

      # Timeouts
      timeout: "30s"                  # Connection timeout
      read_timeout: "60s"             # Read timeout (wait for customer)
      write_timeout: "10s"            # Write timeout

      # Retry settings
      max_retries: "3"                # Maximum retry attempts
      retry_delay: "2s"               # Delay between retries

