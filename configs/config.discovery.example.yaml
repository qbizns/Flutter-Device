# ==============================================================================
# Performance Notes
# ==============================================================================
#
# Scan Interval Guidelines:
#   - Development: 10-30s (fast iteration)
#   - Production: 5-10m (reduce CPU usage)
#   - Kiosk/POS: 1-2m (balance responsiveness & performance)
#
# Resource Impact:
#   - USB Discovery: Low CPU, no network, no disk
#   - Serial Discovery: Medium CPU (protocol probing), no network
#   - mDNS Discovery: Low CPU, low network, no disk
#   - TCP Discovery: High CPU, high network (avoid in production)
#
# Optimization Tips:
#   1. Disable unused transports
#   2. Increase scan_interval for stable environments
#   3. Reduce baud_rates list for serial discovery
#   4. Limit mDNS services to what you actually use
#
# Security Considerations:
#   - Set auto_register: false in production
#   - Review discovered devices before registering
#   - Use allowlists for vendor_id/product_id (future feature)
#   - Monitor discovery events for unexpected devices
