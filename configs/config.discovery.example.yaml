# Device Auto-Discovery Configuration Examples
# ============================================
#
# This file demonstrates various discovery configurations for automatic
# device detection across USB, Serial, and Network transports.

# Server Configuration
server:
  grpc:
    address: ":50051"
  rest:
    address: ":8080"
  websocket:
    path: "/ws"

security:
  mode: "development"

# ==============================================================================
# Example 1: Full Auto-Discovery (Development Environment)
# ==============================================================================
# Discovers all device types and auto-registers them
# Good for development and testing

discovery:
  enabled: true
  scan_interval: 30s          # Scan every 30 seconds
  auto_register: true          # Automatically register discovered devices

  transports:
    - usb
    - serial
    - mdns

  usb:
    discover_printers: true
    discover_scanners: true

  serial:
    discover_scales: true
    baud_rates:
      - 9600
      - 19200
    probe_timeout: 2s

  mdns:
    services:
      - "_ipp._tcp"
      - "_printer._tcp"
    timeout: 3s

