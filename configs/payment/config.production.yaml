# Payment Terminal Driver Configuration - Production Environment
# Version: 1.0
# Last Updated: 2025-11-11
#
# WARNING: This is a production configuration file
# All sensitive values MUST be loaded from environment variables or secrets manager
# Never commit credentials or API keys to version control

# Environment
environment: production
log_level: warn

# Connection settings
connection:
  # Production terminal endpoints
  host: "${PAYMENT_TERMINAL_HOST}"  # From environment or secrets
  port: 3000

  # Connection timeouts (production values)
  connect_timeout: 20s
  read_timeout: 45s
  write_timeout: 45s

  # Retry configuration (aggressive retries for production)
  max_retries: 5
  retry_delay: 2s
  retry_backoff: exponential
  max_retry_delay: 60s

  # Keep-alive
  keep_alive: true
  keep_alive_interval: 90s

  # Connection pooling
  max_idle_connections: 10
  max_connections_per_host: 20

# TLS/SSL configuration (strict)
tls:
  enabled: true
  min_version: "1.3"  # TLS 1.3 only in production
  verify_server_cert: true

  # Certificate paths (from secrets volume)
  cert_file: /run/secrets/payment_client_cert
  key_file: /run/secrets/payment_client_key
  ca_file: /run/secrets/payment_ca_cert

  # Certificate pinning (required in production)
  pin_certificates: true
  pinned_certs:
    - /run/secrets/payment_pinned_cert_1
    - /run/secrets/payment_pinned_cert_2

  # Cipher suites (only strongest)
  cipher_suites:
    - TLS_AES_256_GCM_SHA384
    - TLS_AES_128_GCM_SHA256
    - TLS_CHACHA20_POLY1305_SHA256

# Transaction settings
transaction:
  # Default timeout for transactions
  default_timeout: 60s

  # Maximum transaction timeout
  max_timeout: 120s

  # Transaction amount limits (in minor currency units)
  min_amount: 1
  max_amount: 10000000  # 100,000.00

  # Auto-void on failure (disabled in production)
  auto_void_on_failure: false

  # Transaction validation
  validate_amount: true
  validate_currency: true
  validate_card_number: true

# Audit logging (comprehensive)
audit:
  enabled: true

  # Log to multiple destinations
  output: file
  file_path: /var/log/payment/audit.log

  # Log rotation (aggressive)
  max_size: 100  # MB
  max_backups: 365  # 1 year of daily logs
  max_age: 365  # days (1 year retention for compliance)
  compress: true

  # Structured logging (JSON for parsing)
  format: json

  # Card data masking (REQUIRED - PCI DSS compliance)
  mask_card_data: true

  # Include full transaction details for audit
  include_transaction_details: true

  # Tamper detection
  enable_integrity_checks: true
  sign_audit_logs: true

  # Retention (PCI DSS requires 1 year minimum)
  retention_days: 365

  # Batch size for writing (larger batches for performance)
  batch_size: 100
  flush_interval: 30s

  # Backup audit logs to remote storage
  remote_backup:
    enabled: true
    endpoint: "${AUDIT_BACKUP_ENDPOINT}"
    interval: 1h

# Monitoring (full observability)
monitoring:
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
    include_go_metrics: true
    include_process_metrics: true

  # Health check endpoint
  health_check:
    enabled: true
    port: 8080
    path: /health
    readiness_path: /health/ready
    liveness_path: /health/live

    # Include dependency checks
    check_database: true
    check_terminal_connection: true

  # Performance profiling (DISABLED in production)
  profiling:
    enabled: false

  # Distributed tracing (sampled)
  tracing:
    enabled: true
    endpoint: "${JAEGER_ENDPOINT}"
    sampling_rate: 0.01  # 1% sampling to reduce overhead

  # Log aggregation (required)
  log_aggregation:
    enabled: true
    endpoint: "${LOGSTASH_ENDPOINT}"
    format: json
    include_metadata: true

  # Metrics push (optional - for Prometheus Pushgateway)
  metrics_push:
    enabled: false
    endpoint: "${PUSHGATEWAY_ENDPOINT}"
    interval: 60s

# Provider configurations
providers:
  # Mada (production)
  mada:
    enabled: true
    terminal_id: "${MADA_TERMINAL_ID}"
    merchant_id: "${MADA_MERCHANT_ID}"
    currency: "SAR"
    min_amount: 100  # 1.00 SAR
    max_amount: 10000000  # 100,000.00 SAR

    # Provider-specific settings (from secrets)
    auth_key: "${MADA_AUTH_KEY}"
    endpoint: "${MADA_ENDPOINT}"

    # Connection limits
    max_concurrent_transactions: 10
    timeout: 60s

  # KNET (production)
  knet:
    enabled: true
    terminal_id: "${KNET_TERMINAL_ID}"
    merchant_id: "${KNET_MERCHANT_ID}"
    currency: "KWD"
    min_amount: 100  # 0.100 KWD
    max_amount: 10000000  # 10,000.000 KWD

    # Provider-specific settings (from secrets)
    auth_key: "${KNET_AUTH_KEY}"
    endpoint: "${KNET_ENDPOINT}"

    # Connection limits
    max_concurrent_transactions: 10
    timeout: 60s

# Settlement (automated)
settlement:
  # Auto-settlement enabled
  auto_settle: true

  # Settlement time (23:00 local time)
  settle_time: "23:00"

  # Settlement timezone
  timezone: "Asia/Riyadh"

  # Retry failed settlements (aggressive)
  retry_failed: true
  max_settlement_retries: 5
  retry_delay: 5m

  # Settlement notifications
  notify_on_success: true
  notify_on_failure: true
  notification_endpoint: "${SETTLEMENT_NOTIFICATION_ENDPOINT}"

# Security (strict)
security:
  # Rate limiting (strict)
  rate_limiting:
    enabled: true
    requests_per_second: 50
    burst: 100

    # Per-device limits
    per_device_rps: 10
    per_device_burst: 20

  # Request timeout
  request_timeout: 120s

  # IP whitelisting (required in production)
  ip_whitelist:
    enabled: true
    allowed_ips:
      # Load from environment or config management
      - "${ALLOWED_IP_1}"
      - "${ALLOWED_IP_2}"

  # Authentication (required)
  auth:
    enabled: true
    type: mutual_tls  # mTLS for production
    verify_client_cert: true

  # Encryption at rest
  encryption_at_rest:
    enabled: true
    key_id: "${ENCRYPTION_KEY_ID}"

  # PCI DSS compliance
  pci_dss:
    enabled: true
    version: "4.0"
    validate_compliance: true

# High availability
high_availability:
  # Health checks
  health_check_interval: 30s

  # Graceful shutdown
  graceful_shutdown_timeout: 60s

  # Circuit breaker
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    success_threshold: 2
    timeout: 60s

  # Failover
  enable_failover: true
  failover_endpoints:
    - "${FAILOVER_ENDPOINT_1}"
    - "${FAILOVER_ENDPOINT_2}"

# Performance tuning
performance:
  # Worker pool size
  worker_pool_size: 100

  # Buffer sizes
  read_buffer_size: 4096
  write_buffer_size: 4096

  # Connection reuse
  enable_connection_reuse: true
  max_idle_time: 90s

  # Memory limits
  max_memory_mb: 512

# Compliance
compliance:
  # PCI DSS
  pci_dss_enabled: true

  # GDPR (if applicable)
  gdpr_enabled: false

  # Data residency
  data_residency: "SA"  # Saudi Arabia

  # Audit requirements
  audit_retention_days: 365
  require_audit_signature: true

# Production-specific settings
production:
  # Debug endpoints (DISABLED)
  debug_endpoints: false

  # Panic recovery
  enable_panic_recovery: true
  panic_notification_endpoint: "${PANIC_NOTIFICATION_ENDPOINT}"

  # Metrics
  detailed_metrics: true
  metric_cardinality_limit: 1000

  # Alerting
  enable_alerts: true
  alert_endpoint: "${ALERTMANAGER_ENDPOINT}"

  # Maintenance mode
  maintenance_mode_enabled: false
  maintenance_mode_message: "Payment system is under maintenance"
