#       # Only send critical metrics to remote storage
#       - source_labels: [__name__]
#         regex: 'payment_(transactions_total|errors_total|transaction_duration_seconds.*).*'
#         action: keep

# Remote read configuration (optional)
# remote_read:
#   - url: 'https://prometheus-remote-storage.example.com/api/v1/read'
#     read_recent: true

# Storage configuration
storage:
  tsdb:
    # How long to retain samples in storage
    retention.time: 15d

    # Maximum size of storage (overrides retention.time if reached first)
    retention.size: 50GB

    # Compress old blocks
    wal_compression: true

# Tracing configuration (optional - for distributed tracing)
# tracing:
#   endpoint: "jaeger:14268/api/traces"
#   client_type: "http"
#   sampling_fraction: 0.1
#   insecure: false
