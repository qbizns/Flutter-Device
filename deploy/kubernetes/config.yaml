apiVersion: v1
kind: Namespace
metadata:
  name: device-bridge

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: device-bridge
  namespace: device-bridge

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: device-bridge-config
  namespace: device-bridge
data:
  config.yaml: |
    # Device Bridge v2 - Kubernetes Configuration
    environment: production
    log_level: info

    connection:
      use_simulator: false
      connect_timeout: 20s
      read_timeout: 45s
      write_timeout: 45s
      max_retries: 5
      retry_delay: 2s

    tls:
      enabled: true
      min_version: "1.3"
      verify_server_cert: true

    transaction:
      default_timeout: 60s
      max_timeout: 120s
      min_amount: 1
      max_amount: 10000000

    audit:
      enabled: true
      output: file
      file_path: /var/log/device-bridge/audit.log
      format: json
      mask_card_data: true
      retention_days: 365

    monitoring:
      prometheus:
        enabled: true
        port: 9090
        path: /metrics
      health_check:
        enabled: true
        port: 8080
        path: /health
      tracing:
        enabled: true
        sampling_rate: 0.01

    security:
      rate_limiting:
        enabled: true
        requests_per_second: 50
        burst: 100
      request_timeout: 120s

---
apiVersion: v1
kind: Secret
metadata:
  name: payment-credentials
  namespace: device-bridge
type: Opaque
stringData:
  # Mada credentials (replace with actual values)
  mada-terminal-id: "REPLACE_ME"
  mada-merchant-id: "REPLACE_ME"
  mada-auth-key: "REPLACE_ME"

  # KNET credentials (replace with actual values)
  knet-terminal-id: "REPLACE_ME"
  knet-merchant-id: "REPLACE_ME"
  knet-auth-key: "REPLACE_ME"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: device-bridge-data
  namespace: device-bridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Storage class (adjust based on your cluster)
  # storageClassName: standard
