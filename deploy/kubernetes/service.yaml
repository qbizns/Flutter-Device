apiVersion: v1
kind: Service
metadata:
  name: device-bridge
  namespace: device-bridge
  labels:
    app: device-bridge
spec:
  type: ClusterIP
  selector:
    app: device-bridge
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: device-bridge-external
  namespace: device-bridge
  labels:
    app: device-bridge
spec:
  type: LoadBalancer
  selector:
    app: device-bridge
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  # Cloud provider specific annotations
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  #   service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:..."
